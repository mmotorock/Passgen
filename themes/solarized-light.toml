# Passgen theme. Copy this file under a new name in the themes folder to make your own;
# the file name (without .toml) is the theme's ID in config.toml.
#
# Every colour is optional and written as "#rrggbb" (or "#rrggbbaa"). A missing one keeps
# the colour of egui's built-in light or dark theme, chosen by `dark`.
#
#   background     window and panel background
#   surface        text fields and other recessed areas
#   text           normal text and icons
#   weak_text      descriptions, timestamps and hints
#   strong_text    text on buttons while pressed, headings
#   widget         buttons, checkboxes, sliders
#   widget_hover   the same, under the mouse
#   widget_active  the same, while pressed
#   border         separators and outlines
#   accent         the selected style button, selected text, slider fill
#   accent_text    text drawn on the accent colour
#   error          warnings under the Generate button
#   success        the check mark after copying
#   digit          digits in passwords
#   symbol         symbols in passwords

name = "Solarized Light"
dark = false

[colors]
background    = "#fdf6e3"
surface       = "#fffbf0"
text          = "#586e75"
weak_text     = "#93a1a1"
strong_text   = "#073642"
widget        = "#eee8d5"
widget_hover  = "#e4ddc8"
widget_active = "#d6cfb9"
border        = "#e4ddc8"
accent        = "#268bd2"
accent_text   = "#fdf6e3"
error         = "#dc322f"
success       = "#859900"
digit         = "#2aa198"
symbol        = "#cb4b16"
